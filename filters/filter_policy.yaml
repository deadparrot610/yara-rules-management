version: 1
default_mode: include_all
on_empty_output: fail
min_output_rules: 1
filters: []

# as_of: "2026-01-01"
# Pins the reference date that relative bounds (meta_date.older_than) measure
# from. Left unset, a build uses --as-of if given, else today. Set it to freeze
# the window so this commit filters identically on any day.

# Example filters (uncomment and adapt). Selector keys AND together:
#   name / name_glob / name_regex  — match on the rule identifier
#   tags                           — rule carries all listed tags
#   meta                           — exact key/value on a meta field
#   meta_in                        — meta value is one of a list
#   meta_date                      — a date-valued meta field within a range
#
# meta_date compares the rule's date after reading it against the formats
# declared in config/build.yaml meta_dates.input_formats, so a vendor rule
# written "04/18/2026" still answers a bound correctly. The bounds below are
# always strict ISO — the declared-format leniency applies to rule input we
# don't control, never to policy we author.
#
# A meta_date bound may also be written relative to the reference date:
#   older_than: 5y   ==  before: <as_of minus five years>
# Duration is an integer plus 'd', 'm' or 'y' ("730d", "18m", "5y"); months and
# years are calendar arithmetic. A rule with no value in that field is never
# aged out. With a relative bound in play, reproducing a build means replaying
# its as_of (recorded in dist/build_manifest.json) via --as-of.
#
# filters:
#   - id: F-drop-old-vendor
#     description: "Retire vendor rules authored before the Q2 refresh"
#     scope: vendor
#     action: exclude
#     match:
#       meta_date:
#         field: date            # meta field to compare (normalized)
#         before: "2026-05-01"   # strict <  (after: strict > ), YYYY-MM-DD
#     reason: "Superseded by refreshed vendor feed"
#
#   - id: F-retire-stale
#     description: "Retire vendor rules not refreshed in five years"
#     scope: vendor
#     action: exclude
#     match:
#       meta_date:
#         field: last_modified
#         older_than: 5y       # relative to as_of; strict <
#     reason: "Not refreshed in five years"
#
#   - id: F-keep-window
#     description: "Keep only rules dated within a window (between two dates)"
#     scope: global
#     action: include
#     match:
#       meta_date:
#         field: date
#         on_or_after: "2026-05-01"   # inclusive >=
#         on_or_before: "2026-06-30"  # inclusive <=
