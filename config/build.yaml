output_formats: [source]
yara_modules: [pe, elf, math]
external_variables:
  filename: ""
  filepath: ""
  filetype: ""
stale_override_decisions: overrides/stale_override_decisions.yaml
coverage_gap_decisions: filters/coverage_gap_decisions.yaml
required_meta: [author, date, description, reference, severity]

# Date-valued meta fields. Lint validates these on EVERY rule (vendor included,
# unlike required_meta) and the filter engine normalizes them before comparing
# meta_date bounds. Source files are never rewritten.
meta_dates:
  fields: [date]

  # The COMPLETE set of accepted NON-ISO formats (strptime), TRIED IN THE ORDER
  # LISTED. Order is the tie-break for ambiguous values: with "%m/%d/%Y" before
  # "%d/%m/%Y", "03/04/2026" is March 4. There is no fallback parser — a value
  # matching neither ISO nor an entry here is unparsable, and on_unparsable
  # below decides its fate.
  #
  # ISO 8601 is ALWAYS accepted and must not be listed: "%Y-%m-%d" first, then
  # any ISO date+time — "2026-07-29T14:22:01Z", "2026-07-29 14:22:01", numeric
  # offsets, fractional seconds. Entries here may carry time directives too
  # (e.g. "%m/%d/%Y %H:%M") for feeds that timestamp in a non-ISO shape.
  #
  # A time component is truncated to its date, and a UTC offset is IGNORED
  # rather than converted: "2026-07-29T22:00:00-06:00" is July 29, the date a
  # human reading the rule sees.
  #
  # Month-, day- and timezone-NAME directives (%b/%B/%a/%A/%Z) are rejected:
  # strptime reads them against the machine's locale, which would make results
  # depend on where the build ran (NFR-6). A vendor date like "July 29, 2026"
  # is unparsable. Numeric %z is fine — it is unambiguous.
  #
  # Kept deliberately short: every unparsable value is named in the lint/build
  # output and every non-ISO parse is recorded in the build manifest, so a real
  # vendor drop tells you which formats to pin here rather than guessing and
  # widening the ambiguity surface for formats never emitted.
  input_formats:
    - "%m/%d/%Y"      # 07/29/2026  (month-first)
    - "%Y/%m/%d"      # 2026/07/29
    - "%Y%m%d"        # 20260729
  # - "%m/%d/%Y %H:%M"        # 07/29/2026 14:22
  # - "%m/%d/%Y %H:%M:%S %z"  # 07/29/2026 14:22:01 -0500

  # What an unparsable date costs:
  #   fail          — lint errors and the build blocks. No artifact is written.
  #   warn_and_drop — every offender is logged, and those rules are removed from
  #                   the corpus after the override strip and before the filter
  #                   phase. Drops are recorded in the build manifest under
  #                   dropped_unparsable_dates and still run through the
  #                   coverage-gap, referential-integrity and floor cross-checks,
  #                   so dropping an override rule can still block the build.
  on_unparsable: fail
