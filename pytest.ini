[pytest]
# scripts/ is not a package; put it on the import path so tests can
# `import build_ruleset`, `import corpus`, etc. the same way the CLI entrypoints do
# (python scripts/x.py puts scripts/ on sys.path[0]).
pythonpath = scripts
testpaths = tests
# Emit JUnit XML for CI (GitLab MR test integration); output is gitignored.
addopts = --junitxml=test-results/junit.xml
